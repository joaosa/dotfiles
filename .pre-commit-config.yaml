# Local hooks run via `prek` (a faster pre-commit runner, installed by Nix).
# They shell out to the tools from the dev shell (`nix develop`) / the flake,
# so versions track flake.lock rather than separately pinned hook repos.
#
# Install once:  prek install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false

      - id: nixfmt
        name: nixfmt (treefmt)
        entry: nix fmt --
        language: system
        files: \.nix$
        pass_filenames: false

      # One hook for both linters so the dev shell is realized once per
      # commit; pre-commit only, since the pre-push flake check (and CI)
      # already runs them as flake checks.
      - id: nix-lints
        name: statix + deadnix
        entry: nix develop -c sh -c "statix check . && deadnix --fail ."
        language: system
        files: \.nix$
        pass_filenames: false
        stages: [pre-commit]

      - id: flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        files: \.(nix|lock)$
        pass_filenames: false
        stages: [pre-push]
